<meta name="description" content="瀏覽器密室逃脫：在亡師的老宅裡找回日、月、星三枚徽章，揭開一顆彗星的真名。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&family=Noto+Serif+TC:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/*
 * 觀星者之屋 — 樣式
 * 刻意只有一套夜色主題：整個故事發生在一個雨後的夜晚。
 * 版面：左邊是房間場景（16:9），右邊是物品欄與紀錄；窄螢幕時上下堆疊。
 */
:root {
  color-scheme: dark;
  --night: #0b1020;
  --night-2: #111830;
  --night-3: #19223f;
  --rule: #2a3558;
  --star: #ece6d6;
  --dim: #9ea6bf;
  --brass: #c9a24f;
  --brass-hi: #e8c97f;
  --brass-ink: #2a1d08;
  --paper: #efe6cf;
  --paper-2: #e4d8b9;
  --paper-ink: #2b2418;
  --paper-dim: #6b5a3a;
  --good: #8cc49a;
  --bad: #e39a8a;
  --event: #c3b4f2;
  --note: #94bde4;
  --safelight: #c0392b;
  --shadow: rgba(0, 0, 0, .45);
  --font-ui: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Zen Hei", serif;
  --font-hand: "LXGW WenKai TC", "Kaiti TC", "DFKai-SB", var(--font-ui);
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--star);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass-hi); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- 共用按鈕 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4em;
  min-height: 40px; padding: .35em 1em;
  background: var(--night-3); border: 1px solid var(--rule); border-radius: 8px;
  cursor: pointer; letter-spacing: .04em;
  transition: background .15s, border-color .15s, color .15s;
}
.btn:hover { border-color: var(--brass); color: var(--brass-hi); }
.btn:disabled { opacity: .45; cursor: not-allowed; border-color: var(--rule); color: var(--dim); }
.btn.primary { background: var(--brass); border-color: var(--brass-hi); color: var(--brass-ink); font-weight: 700; }
.btn.primary:hover { background: var(--brass-hi); color: var(--brass-ink); }
.btn.danger { border-color: #6a3a34; }
.btn.danger:hover { border-color: var(--bad); color: var(--bad); }
.btn.small { min-height: 32px; padding: .15em .7em; font-size: .9em; }
.btn.ghost { background: transparent; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---------- 標題畫面 ---------- */
.screen { min-height: 100%; }
#title {
  position: relative; min-height: 100%; display: grid; place-items: center; overflow: hidden;
  padding-block: 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.title-card { position: relative; text-align: center; max-width: 34rem; }
.title-eyebrow { color: var(--dim); letter-spacing: .5em; font-size: .85rem; margin: 0 0 .5rem; }
.title-main {
  font-size: clamp(2.6rem, 9vw, 4.6rem); line-height: 1.15; margin: 0; font-weight: 700;
  letter-spacing: .18em; color: var(--brass-hi); text-wrap: balance;
  text-shadow: 0 0 28px rgba(232, 201, 127, .25);
}
.title-sub { margin: .6rem 0 2rem; color: var(--star); letter-spacing: .3em; }
.title-menu { display: grid; gap: 10px; justify-items: stretch; max-width: 18rem; margin: 0 auto; }
.title-foot { margin-top: 1.6rem; color: var(--dim); font-size: .85rem; }

/* ---------- 開場 ---------- */
#intro { display: grid; place-items: center; min-height: 100%; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.intro-card { max-width: 36rem; }
.intro-text { font-size: 1.15rem; line-height: 2.1; min-height: 9em; }
.intro-text p { margin: 0 0 1em; animation: fadeUp .7s both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- 遊戲畫面 ---------- */
.app {
  max-width: 1320px; margin: 0 auto;
  padding-block: 10px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  padding-block: 6px 12px; border-bottom: 1px solid var(--rule); margin-bottom: 14px;
}
.brand { font-weight: 700; letter-spacing: .2em; color: var(--brass-hi); }
.room-name { font-size: 1.25rem; letter-spacing: .12em; }
.progress { display: flex; gap: 6px; align-items: center; }
.emb {
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  font-size: .9rem; border: 1px dashed var(--rule); color: var(--dim);
}
.emb.held { border: 1px solid var(--brass); color: var(--brass-hi); }
.emb.inserted { background: var(--brass); color: var(--brass-ink); border: 1px solid var(--brass-hi); font-weight: 700; }
.chip { font-size: .85rem; color: var(--dim); border: 1px solid var(--rule); border-radius: 999px; padding: .1em .7em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.on { color: var(--brass-hi); border-color: var(--brass); }
.topbar .spacer { flex: 1 1 auto; }
.topbar .row { gap: 6px; }

.stage { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 16px; align-items: start; }
.main-col, .side-col { min-width: 0; display: grid; gap: 12px; }

.scene-wrap {
  position: relative; aspect-ratio: 16 / 9; max-width: 100%;
  border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; background: #000;
  box-shadow: 0 12px 30px var(--shadow);
}
.scene-svg { width: 100%; height: 100%; display: block; }
.hs { cursor: pointer; transition: filter .15s; }
.hs:hover, .hs:focus-visible, .hs.flash { filter: drop-shadow(0 0 5px rgba(232, 201, 127, .95)) brightness(1.18); outline: none; }
body.holding .hs { cursor: crosshair; }
.scene-tip {
  position: absolute; left: 10px; bottom: 10px; max-width: calc(100% - 20px);
  background: rgba(9, 12, 24, .85); border: 1px solid var(--rule); border-radius: 6px;
  padding: .15em .7em; font-size: .9rem; pointer-events: none;
}
.ring { animation: ring .5s ease-in-out infinite alternate; transform-origin: 620px 340px; }
@keyframes ring { from { opacity: .3; } to { opacity: 1; } }
.glint { animation: glint 2.4s ease-in-out infinite; }
@keyframes glint { 0%, 70%, 100% { opacity: .15; } 80% { opacity: 1; } }

.narration {
  min-height: 3.4em; padding: 10px 14px; border-radius: var(--radius);
  background: linear-gradient(90deg, rgba(201, 162, 79, .10), rgba(201, 162, 79, 0) 70%);
  border-left: 3px solid var(--brass); display: grid; gap: 4px;
}
.narration p { margin: 0; }
.objects { display: flex; flex-wrap: wrap; gap: 6px; }
.objects .label { color: var(--dim); font-size: .85rem; margin-right: 4px; align-self: center; }
.obj-btn { min-height: 34px; padding: .1em .75em; font-size: .92rem; border-radius: 999px; }

.nav { display: flex; flex-wrap: wrap; gap: 6px; }
.nav .btn { min-height: 34px; font-size: .92rem; }
.nav .btn.here { border-color: var(--brass); color: var(--brass-hi); background: rgba(201, 162, 79, .12); }

.panel { background: var(--night-2); border: 1px solid var(--rule); border-radius: var(--radius); padding: 12px; }
.panel h2 { font-size: .95rem; letter-spacing: .2em; color: var(--dim); margin: 0 0 8px; font-weight: 600; }

.inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(66px, 1fr)); gap: 8px; }
.inv-tile {
  display: grid; justify-items: center; gap: 4px; padding: 8px 4px 6px; min-height: 84px;
  background: var(--night-3); border: 1px solid var(--rule); border-radius: 8px; cursor: pointer;
  text-align: center; font-size: .78rem; line-height: 1.3;
}
.inv-tile:hover { border-color: var(--brass); }
.inv-tile.sel { border-color: var(--brass-hi); box-shadow: 0 0 0 2px rgba(232, 201, 127, .35) inset; background: #232c4d; }
.inv-tile.target { border-style: dashed; border-color: var(--note); }
.seal {
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  font-size: 1.05rem; font-weight: 700; border: 2px solid currentColor;
}
.seal.k-paper { color: #d9cfb3; } .seal.k-tool { color: #9fb6cc; } .seal.k-key { color: #d8b04f; }
.seal.k-page { color: #c9b08a; } .seal.k-emblem { color: #f2d27c; background: rgba(242, 210, 124, .14); }
.seal.k-evidence { color: #f4f0e6; background: rgba(255, 255, 255, .08); }
.inv-empty { color: var(--dim); font-size: .9rem; margin: 0; }
.item-detail { margin-top: 10px; border-top: 1px solid var(--rule); padding-top: 10px; }
.item-detail h3 { margin: 0 0 4px; font-size: 1.02rem; color: var(--brass-hi); }
.item-detail p { margin: 0 0 8px; font-size: .92rem; color: var(--star); }
.hold-tip { font-size: .85rem; color: var(--note); margin: 0 0 8px; }

.log { display: grid; gap: 6px; max-height: 300px; overflow-y: auto; font-size: .93rem; }
.log p { margin: 0; padding-left: 10px; border-left: 2px solid var(--rule); }
.log p.fresh { border-left-color: var(--brass); }
.log p.old { opacity: .55; }
.m-good { color: var(--good); } .m-bad { color: var(--bad); } .m-event { color: var(--event); }
.m-item { color: var(--brass-hi); } .m-note { color: var(--note); font-size: .88em; } .m-room { color: var(--dim); font-style: italic; }

/* ---------- 對話框 ---------- */
.modal-back {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
  background: rgba(4, 6, 14, .78); backdrop-filter: blur(3px);
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.modal {
  width: min(860px, 100%); max-height: 100%; overflow: auto;
  background: var(--night-2); border: 1px solid var(--rule); border-radius: 12px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
}
.modal-head {
  position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; background: var(--night-2); border-bottom: 1px solid var(--rule);
}
.modal-head h2 { margin: 0; font-size: 1.1rem; letter-spacing: .1em; flex: 1; min-width: 0; text-wrap: balance; }
.modal-body { padding: 16px; display: grid; gap: 14px; }
.modal-body > * { min-width: 0; }
.lead { margin: 0; color: var(--dim); }
.feedback { min-height: 1.6em; margin: 0; }
.feedback p { margin: 0; }
.art { width: 100%; height: auto; display: block; max-width: 100%; border-radius: 8px; }
.art-box { max-width: 560px; margin: 0 auto; width: 100%; }
.art-box.narrow { max-width: 380px; }
.eyepiece { max-width: 400px; margin: 0 auto; }

/* 紙本文件 */
.paper {
  background: var(--paper); color: var(--paper-ink); border-radius: 4px; padding: 22px 26px;
  box-shadow: 0 6px 18px var(--shadow); max-width: 40rem; margin: 0 auto; width: 100%;
}
.paper p { margin: 0 0 .8em; }
.paper p:last-child { margin-bottom: 0; }
.paper.hand { font-family: var(--font-hand); font-size: 1.12rem; line-height: 1.9; background: linear-gradient(var(--paper), var(--paper-2)); }
.paper.news { font-size: .98rem; columns: 1; }
.paper.news p:first-child { font-size: .85rem; color: var(--paper-dim); letter-spacing: .1em; border-bottom: 1px solid #b9ab88; padding-bottom: .4em; }
.paper.news p:nth-child(2) { font-weight: 700; font-size: 1.18rem; }
.paper.news p:last-child { font-family: var(--font-hand); color: #8a2a20; }
.paper.plain { background: #d8cfba; font-size: 1.02rem; }
.paper.table p { font-family: var(--font-mono); font-variant-numeric: tabular-nums; margin: 0 0 .3em; letter-spacing: .05em; }
.paper.table p:first-child { font-family: var(--font-ui); font-weight: 700; border-bottom: 1px solid #b9ab88; padding-bottom: .3em; }
.paper h3 { margin: 0 0 .6em; font-size: 1rem; color: var(--paper-dim); font-family: var(--font-ui); letter-spacing: .1em; }
.paper + .paper { margin-top: 12px; }

/* 數字鎖 */
.lock { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.wheel { display: grid; justify-items: center; gap: 4px; }
.wheel .digit {
  width: 58px; height: 70px; display: grid; place-items: center; border-radius: 8px;
  background: linear-gradient(#1b1408, #3a2a12 45%, #1b1408); border: 2px solid var(--brass);
  font-family: var(--font-mono); font-size: 2rem; color: var(--brass-hi); font-variant-numeric: tabular-nums;
}
.wheel .btn { width: 58px; min-height: 34px; padding: 0; }

/* 選擇器（星盤、時鐘） */
.picker { display: grid; gap: 8px; justify-items: center; }
.picker-row { display: grid; grid-template-columns: 4.5em 44px minmax(6em, auto) 44px; align-items: center; gap: 8px; }
.picker-row .name { text-align: center; font-size: 1.2rem; font-weight: 700; color: var(--brass-hi); }
.picker-row .lbl { color: var(--dim); text-align: right; }

/* 花盆 */
.pots { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.pot { background: var(--night-3); border: 1px solid var(--rule); border-radius: 8px; padding: 12px; display: grid; gap: 8px; }
.pot h3 { margin: 0; font-size: 1.05rem; color: var(--brass-hi); }
.pot q { font-family: var(--font-hand); font-size: 1.1rem; quotes: "「" "」"; }

/* 羅盤 */
.compass { display: grid; grid-template-columns: repeat(3, minmax(64px, 96px)); gap: 8px; justify-content: center; }
.compass .center { display: grid; place-items: center; border: 1px dashed var(--rule); border-radius: 8px; color: var(--dim); font-size: .85rem; text-align: center; }
.compass .btn.cur { background: var(--brass); color: var(--brass-ink); border-color: var(--brass-hi); }

/* 顯影 */
.bottles { display: grid; grid-template-columns: repeat(4, minmax(60px, 96px)); gap: 10px; justify-content: center; }
.bottle-btn { display: grid; justify-items: center; gap: 2px; padding: 8px 4px; background: #2a0c08; border: 1px solid #6a2a20; border-radius: 8px; cursor: pointer; }
.bottle-btn:hover { border-color: #ff8a70; }
.bottle-btn .bottle { width: 44px; height: 72px; }
.slots { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.slot { min-width: 76px; padding: 6px 8px; border: 1px dashed #6a2a20; border-radius: 6px; text-align: center; font-size: .92rem; }
.slot.filled { border-style: solid; background: #2a0c08; }
.darkroom-tone { background: #1a0605; border-color: #4a1612; }

/* 對話 */
.dialogue { display: grid; gap: 10px; }
.dialogue p { margin: 0; }
.dialogue .speaker { color: var(--dim); font-size: .85rem; letter-spacing: .1em; }
.dialogue .line { font-size: 1.05rem; }
.choices { display: grid; gap: 8px; }
.choices .btn { justify-content: flex-start; text-align: left; min-height: 48px; }
.confirm { border: 1px solid var(--bad); border-radius: 8px; padding: 12px; display: grid; gap: 8px; }

/* 筆記、提示、存檔 */
.list { display: grid; gap: 8px; }
.list .btn { justify-content: space-between; }
.hint { border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; }
.hint h3 { margin: 0; font-size: 1rem; }
.hint ol { margin: 0; padding-left: 1.3em; }
.hint li { margin: 0 0 4px; }
.slot-card { border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; }
.slot-card .meta { color: var(--dim); font-size: .88rem; }
textarea.code {
  width: 100%; min-height: 84px; resize: vertical; font-family: var(--font-mono); font-size: .8rem;
  background: #070a14; color: var(--star); border: 1px solid var(--rule); border-radius: 6px; padding: 8px;
}
.notice { margin: 0; font-size: .9rem; color: var(--note); }
.warn { color: var(--bad); }

/* 結局 */
#ending { display: grid; place-items: center; min-height: 100%; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ending-card { max-width: 40rem; display: grid; gap: 16px; }
.ending-rank { color: var(--dim); letter-spacing: .4em; margin: 0; }
.ending-title { font-size: clamp(2rem, 7vw, 3.2rem); margin: 0; color: var(--brass-hi); letter-spacing: .15em; text-wrap: balance; }
.ending-text p { margin: 0 0 1em; font-size: 1.08rem; line-height: 2; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.stat { border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; }
.stat b { display: block; font-size: 1.3rem; color: var(--brass-hi); font-variant-numeric: tabular-nums; }
.stat span { font-size: .82rem; color: var(--dim); }
.gallery { display: grid; gap: 8px; }
.gal { display: flex; gap: 10px; align-items: baseline; border: 1px solid var(--rule); border-radius: 8px; padding: 8px 12px; }
.gal.locked { color: var(--dim); border-style: dashed; }
.gal .rk { font-size: .8rem; color: var(--dim); min-width: 5em; }

@media (max-width: 960px) {
  .stage { grid-template-columns: minmax(0, 1fr); }
  .log { max-height: 200px; }
}
@media (max-width: 520px) {
  body { font-size: 15px; }
  .room-name { font-size: 1.1rem; }
  .wheel .digit { width: 48px; height: 60px; font-size: 1.7rem; }
  .wheel .btn { width: 48px; }
  .picker-row { grid-template-columns: 3.5em 40px minmax(4.5em, auto) 40px; }
  .paper { padding: 16px 16px; }
  .bottles { grid-template-columns: repeat(4, minmax(56px, 1fr)); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

  const MIRROR_GRID = {

    blocks: [{ c: 1, r: 4 }, { c: 5, r: 1 }],
    initial: { A: '/', B: '\\', C: '\\', D: '/', E: '\\', F: '\\', G: '/' },
  };
  const DIRS = { down: [0, 1], up: [0, -1], left: [-1, 0], right: [1, 0] };
  const REFLECT = {
    '/': { right: 'up', up: 'right', left: 'down', down: 'left' },
    '\\': { right: 'down', down: 'right', left: 'up', up: 'left' },
  };
  function traceBeam(config) {
    const g = MIRROR_GRID;
    let c = g.entry.c, r = g.entry.r, d = g.entry.d;
    const path = [{ c, r: -1 }];
    const seen = new Set();
    for (let step = 0; step < 200; step++) {
      if (c < 0 || c >= g.cols || r < 0 || r >= g.rows) {
        path.push({ c, r });
        const side = c < 0 ? 'left' : c >= g.cols ? 'right' : r < 0 ? 'top' : 'bottom';
        const hit = side === g.target.side && r === g.target.r;
        return { path, hit, exit: { side, c, r } };
      }
      path.push({ c, r });
      if (g.blocks.some(b => b.c === c && b.r === r)) return { path, hit: false, exit: { side: 'block', c, r } };
      const m = g.mirrors.find(x => x.c === c && x.r === r);
      if (m) d = REFLECT[(config && config[m.id]) || g.initial[m.id]][d];
      const key = c + ',' + r + ',' + d;
      if (seen.has(key)) return { path, hit: false, exit: { side: 'loop', c, r } };
      seen.add(key);
      c += DIRS[d][0]; r += DIRS[d][1];
    }
    return { path, hit: false, exit: { side: 'loop', c, r } };

    const ids = MIRROR_GRID.mirrors.map(m => m.id);

    for (let mask = 0; mask < (1 << ids.length); mask++) {
      const cfg = {};
      ids.forEach((id, i) => { cfg[id] = (mask >> i) & 1 ? '\\' : '/'; });
      if (traceBeam(cfg).hit) sols.push(cfg);

  /* ================================================================
   * 六、線索組合（物品欄中兩兩組合）
   * ================================================================ */
  const isPagey = id => PAGES.includes(id) || id === 'diary';
  const recipes = [
    {
      pair: ['flashlight_dead', 'battery'],
      run(ctx) {
        ctx.take('flashlight_dead'); ctx.take('battery');
        ctx.say('你把電池塞進手電筒，按下開關——一道白光射了出去。', 'good');
        ctx.give('flashlight');
      },
    },
    {
      pair: ['grid_paper', 'transparency'],
      run(ctx) {
        ctx.take('grid_paper'); ctx.take('transparency');
        ctx.say('你把透明膠片疊在方格紙上，讓四個角的十字一一對齊。三個圈起來的星星，正好落在三個數字上。', 'good');
        ctx.give('overlay');
      },
    },
    {
      pair: ['note_left', 'note_right'],
      run(ctx) {
        ctx.take('note_left'); ctx.take('note_right');
        ctx.say('撕口的鋸齒完全吻合。兩半便條拼在一起，字句終於連貫了。', 'good');
        ctx.give('note_full');
      },
    },
    {
      match: (a, b) => isPagey(a) && isPagey(b) && !(a === 'diary' && b === 'diary'),
      run(ctx, a, b) {
        const bound = new Set(ctx.get('diaryPages') || []);
        for (const id of [a, b]) {
          if (id !== 'diary') bound.add(id);
          ctx.take(id);
        }
        const list = PAGES.filter(p => bound.has(p));
        ctx.set('diaryPages', list);
        ctx.give('diary', true);
        ctx.say(`你按日期把殘頁裝訂在一起。日記現在有 ${list.length} / 4 頁。`, 'good');
      },
    },
  ];

  /* ================================================================
   * 七、謎題的判定（UI 只負責輸入，對錯一律在這裡判定）
   * ================================================================ */
  const inRoom = room => s => s.room === room;
  const lockPuzzle = (opts) => ({
    available: opts.available,
    check(ctx, answer) {
      const code = String(answer == null ? '' : answer).replace(/\D/g, '');
      if (code === opts.code) { opts.success(ctx); return true; }
      ctx.wrong();
      ctx.say(opts.wrongText ? opts.wrongText(code) : '鎖紋絲不動。', 'bad');
      return false;
    },
  });

  const puzzles = {
    drawer: Object.assign(lockPuzzle({
      code: DRAWER_CODE,
      available: s => inRoom('study')(s) && !s.flags.drawerOpen,
      success(ctx) {
        ctx.set('drawerOpen');
        ctx.say('「喀」——抽屜彈開了。', 'good');
        ctx.say('裡面有一把葉子形狀的鑰匙、一捆電池，還有一頁撕下來的日記。');
        ctx.give('greenhouse_key'); ctx.give('battery'); ctx.give('page1');
      },
      wrongText: code => code === DRAWER_TRAP
        ? '鎖紋絲不動。你數的好像是書在架上的位置——便條問的是「第幾卷」。'
        : '鎖紋絲不動。',
    }), { digits: 4, title: '書桌抽屜', prompt: '四位數字鎖。鎖旁的便條寫著：「紅、黃、藍、綠——照這個順序，它們各是第幾卷？」' }),

    safe: Object.assign(lockPuzzle({
      code: SAFE_CODE,
      available: s => inRoom('study')(s) && s.flags.paintingMoved && !s.flags.safeOpen,
      success(ctx) {
        ctx.set('safeOpen');
        ctx.say('轉盤咬合，保險箱的門應聲而開。天鵝絨墊子上放著一枚太陽徽章。', 'good');
        ctx.give('emblem_sun');
      },
    }), { digits: 3, title: '保險箱', prompt: '嵌在牆裡的保險箱，三位數字轉盤。畫框背面寫著：「星星會告訴你數字。」' }),

    trapdoor: Object.assign(lockPuzzle({
      code: TRAPDOOR_CODE,
      available: s => inRoom('greenhouse')(s) && s.flags.trapdoorFound && !s.flags.trapdoorOpen,
      success(ctx) {
        ctx.set('trapdoorOpen');
        ctx.say('數字鎖彈開了。你掀起活板門，一道窄梯通往漆黑的地下。', 'good');
      },
    }), { digits: 4, title: '活板門', prompt: '活板門上的四位數字鎖。鎖旁刻著一顆拖著尾巴的彗星。' }),

    pots: {
      available: s => inRoom('greenhouse')(s) && !s.flags.keyDug,
      check(ctx, potId) {
        const pot = POTS.find(p => p.id === potId);
        if (!pot) return null;
        if (!ctx.has('trowel')) { ctx.say('花盆裡的土壓得很實，徒手挖不動。得找把工具。', 'bad'); return false; }
        if (potId === POT_ANSWER) {
          ctx.set('keyDug');
          ctx.say(`你用小鏟子挖開${pot.name}盆的土，鏟尖「叮」地碰到了金屬——一把黃銅鑰匙。`, 'good');
          ctx.give('brass_key');
          return true;
        }
        ctx.wrong();
        ctx.say(`你挖開${pot.name}盆的土，裡面除了根和泥什麼也沒有。你把土填了回去。`, 'bad');
        return false;
      },
    },

    clock: {
      available: s => inRoom('foyer')(s) && !s.flags.clockSolved,
      check(ctx, ans) {
        const h = Number(ans && ans.h), m = Number(ans && ans.m);
        if (h === CLOCK_ANSWER.h && m === CLOCK_ANSWER.m) {
          ctx.set('clockSolved');
          ctx.say('指針停在三點十五分的那一刻，鐘裡傳來「噹」的一聲，鐘擺箱的小門彈開了。', 'good');
          ctx.say('裡面放著一個黃銅手輪，還有一頁折起來的日記。');
          ctx.give('valve_wheel'); ctx.give('page3');
          return true;
        }
        ctx.wrong();
        ctx.say('你撥好指針，等了一會兒。落地鐘毫無反應。', 'bad');
        return false;
      },
    },

    valves_set: { // 只記錄閥門的開關狀態（不判對錯）
      available: inRoom('greenhouse'),
      silent: true,
      check(ctx, cfg) {
        const clean = {};
        for (const v of VALVES) clean[v.id] = !!(cfg && cfg[v.id]);
        ctx.s.puz.valves = clean;
        return true;
      },
    },
    valves: {
      available: s => inRoom('greenhouse')(s) && !s.flags.waterOk,
      check(ctx, cfg) {
        if (!ctx.flag('wheelInstalled')) { ctx.say('總閘上只剩一根光禿禿的閥桿——手輪不見了，轉不動。', 'bad'); return false; }
        const clean = {};
        for (const v of VALVES) clean[v.id] = !!(cfg && cfg[v.id]);
        ctx.s.puz.valves = clean;
        const r = evalValves(clean);
        if (r.ok) {
          ctx.set('waterOk');
          ctx.say('你轉開總閘，水管裡響起汩汩的水聲。雨水流進月光花和蕨類的花床，肥料水只流向蕨類，仙人掌那一格滴水未沾。', 'good');
          if (ctx.flag('lightOk')) ctx.say('月光花的花苞輕輕顫動了一下。', 'event');
          return true;
        }
        ctx.wrong();
        ctx.say('你轉開總閘——', 'bad');
        for (const p of r.problems) ctx.say(p, 'bad');
        ctx.say('你趕緊關上總閘。幸好沒造成損害。', 'bad');
        return false;
      },
    },

    mirrors: {
      available: s => inRoom('greenhouse')(s),
      silent: true,
      check(ctx, cfg) {
        const clean = {};
        for (const m of MIRROR_GRID.mirrors) clean[m.id] = (cfg && cfg[m.id] === '/') ? '/' : (cfg && cfg[m.id] === '\\') ? '\\' : MIRROR_GRID.initial[m.id];
        ctx.s.puz.mirrors = clean;
        if (ctx.flag('lightOk')) return true;
        if (traceBeam(clean).hit) {
          ctx.set('lightOk');
          ctx.say('月光在鏡面間折了幾折，終於落在月光花上。花苞微微發亮。', 'good');
          if (ctx.flag('waterOk')) ctx.say('月光花的花苞輕輕顫動了一下。', 'event');
          return true;
        }
        return false;
      },
    },

    dome: {
      available: inRoom('observatory'),
      silent: true,
      check(ctx, dir) {
        if (!DIRECTIONS.some(d => d.id === dir)) return null;
        ctx.s.puz.dome = dir;
        const name = DIRECTIONS.find(d => d.id === dir).name;
        ctx.say(`你轉動轉輪，穹頂隆隆作響，觀測窗轉向了${name}方。`);
        return true;
      },
    },

    dial: {
      available: s => inRoom('observatory')(s) && !s.flags.starDialSolved,
      check(ctx, ans) {
        const pick = Array.isArray(ans) ? ans.slice(0, 3) : [];
        if (pick.join() === DIAL_ANSWER.join()) {
          ctx.set('starDialSolved');
          ctx.say('三個環同時「喀」地卡進定位，星盤中心像花瓣一樣向外翻開——裡面是一枚深藍色的星徽。', 'good');
          ctx.give('emblem_star');
          return true;
        }
        ctx.wrong();
        const sameSet = pick.length === 3 && pick.slice().sort().join() === DIAL_ANSWER.slice().sort().join();
        ctx.say(sameSet
          ? '星盤卡了一下，又鬆開了。這三個星座似乎沒錯，但順序不對。'
          : '星盤紋絲不動。', 'bad');
        return false;
      },
    },

    develop: {
      available: s => inRoom('darkroom')(s) && s.flags.darkroomLit && !s.flags.plateDeveloped,
      check(ctx, seq) {
        const pick = Array.isArray(seq) ? seq.slice(0, 4) : [];
        if (pick.join() === DEVELOP_ANSWER.join()) {
          ctx.set('plateDeveloped');
          ctx.say('你先用一張廢片試了一次——影像清清楚楚地浮現出來。順序對了。', 'good');
          ctx.say('你打開避光盒，取出那張封存了二十年的玻璃底片，依序浸過四個藥盤。紅光下，群星一顆顆浮現，星群之間，是一顆拖著短尾的彗星。', 'event');
          ctx.give('plate');
          return true;
        }
        ctx.wrong();
        ctx.say('你先拿一張廢片試了試——片子上一片模糊。順序不對。幸好沒有直接用那張底片。', 'bad');
        return false;
      },
    },

    phone: {
      available: s => inRoom('foyer')(s) && s.flags.phoneRinging,
      check(ctx, choice) {
        if (choice === 'accept' && ctx.has('plate')) {
          ctx.take('plate');
          ctx.set('phoneRinging', false);
          ctx.set('phoneDone');
          ctx.end('D');
          return true;
        }
        if (choice === 'refuse') {
          ctx.set('phoneRinging', false);
          ctx.set('phoneDone');
          ctx.say('「……你會後悔的。」電話被狠狠地掛斷了。過了一會兒，門外傳來汽車發動、駛遠的聲音。', 'event');
          return true;
        }
        return null;
      },
    },

    exit: {
      available: s => inRoom('foyer')(s) && allInserted(s),
      check(ctx, choice) {
        const plate = ctx.has('plate');
        if (choice === 'leave' && !plate) { ctx.end('A'); return true; }
        if (choice === 'publish' && plate) { ctx.end(countPages(ctx.s) === 4 ? 'B' : 'C'); return true; }
        if (choice === 'leave_plate' && plate) { ctx.take('plate'); ctx.end('E'); return true; }
        return null;
      },
    },
  };

  function countPages(s) {
    const bound = (s.flags.diaryPages || []).length;
    const loose = PAGES.filter(p => s.inv.includes(p)).length;
    return bound + loose;
  }

<script>
/*
 * 觀星者之屋 — 遊戲引擎
 * 純邏輯、無 DOM、狀態完全可序列化（JSON），所以存檔與自動化測試都直接使用它。
 * 每個動作都會先檢查合法性（物品是否在身上、熱點是否可見、謎題是否可作答），
 * 介面再怎麼出錯也不會把遊戲帶進非法狀態。
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.EscapeEngine = factory();
}(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  function create(G) {
    const hotspotById = {};
    for (const h of G.hotspots) {
      if (hotspotById[h.id]) throw new Error('重複的熱點 id：' + h.id);
      if (!G.rooms[h.room]) throw new Error('熱點指向不存在的房間：' + h.id);
      hotspotById[h.id] = h;
    }

    function newState() {
      return {
        v: G.saveVersion,
        room: G.startRoom,
        inv: G.startItems.slice(),
        flags: {},
        notes: ['letter'],
        puz: { dome: 'N', valves: {}, mirrors: Object.assign({}, G.MIRROR_GRID.initial) },
        hints: {},
        visited: { [G.startRoom]: true },
        stats: { actions: 0, wrong: 0, hints: 0, playMs: 0 },
        ending: null,
      };
    }

    /* ---------- 結果與上下文 ---------- */
    function result() { return { ok: true, messages: [], open: null, ending: null, moved: null }; }
    function fail(text) { const r = result(); r.ok = false; r.messages.push({ text, kind: 'bad' }); return r; }

    function makeCtx(s, out) {
      const ctx = {
        s,
        flag: k => !!s.flags[k],
        get: k => s.flags[k],
        set(k, v) { s.flags[k] = v === undefined ? true : v; },
        has: id => s.inv.includes(id),
        give(id, quiet) {
          if (!G.items[id]) throw new Error('不存在的物品：' + id);
          if (!s.inv.includes(id)) s.inv.push(id);
          if (!quiet) out.messages.push({ text: '獲得：' + itemName(s, id), kind: 'item', item: id });
        },
        take(id) { const i = s.inv.indexOf(id); if (i >= 0) s.inv.splice(i, 1); },
        say(text, kind) { out.messages.push({ text, kind: kind || 'info' }); },
        open(view) { out.open = view; },
        note(id) {
          if (!G.docs[id]) throw new Error('不存在的線索：' + id);
          if (!s.notes.includes(id)) {
            s.notes.push(id);
            out.messages.push({ text: '線索已記入筆記：' + G.docs[id].title, kind: 'note' });
          }
        },
        goto(room) { enterRoom(s, room, out, ctx); },
        end(id) { s.ending = id; out.ending = id; },
        wrong() { s.stats.wrong++; },
      };
      return ctx;
    }

    function enterRoom(s, room, out, ctx) {
      const R = G.rooms[room];
      if (!R) throw new Error('不存在的房間：' + room);
      if (!R.accessible(s)) { out.messages.push({ text: R.name + '還進不去。', kind: 'bad' }); out.ok = false; return; }
      s.room = room;
      s.visited[room] = true;
      out.moved = room;
      out.messages.push({ text: R.enterText(s), kind: 'room' });
      if (R.onEnter) R.onEnter(ctx || makeCtx(s, out));
    }

    /* ---------- 查詢 ---------- */
    function isVisible(s, h) { return h.room === s.room && (!h.visible || !!h.visible(s)); }
    function visibleHotspots(s) { return G.hotspots.filter(h => isVisible(s, h)); }
    function canEnter(s, room) { return !!G.rooms[room] && G.rooms[room].accessible(s); }
    function itemName(s, id) {
      if (id === 'diary') return `${G.items.diary.name}（${(s.flags.diaryPages || []).length}/4）`;
      return G.items[id] ? G.items[id].name : id;
    }
    function pageCount(s) { return G.countPages(s); }

    function guard(s) {
      if (!s || typeof s !== 'object') return '狀態無效。';
      if (s.ending) return '遊戲已經結束。';
      return null;
    }
    function done(s, out) { if (out.ok) s.stats.actions++; return out; }

    /* ---------- 動作 ---------- */
    function interact(s, hsId) {
      const g = guard(s); if (g) return fail(g);
      const h = hotspotById[hsId];
      if (!h || !isVisible(s, h)) return fail('這裡沒有那樣東西。');
      const out = result();
      h.examine(makeCtx(s, out));
      return done(s, out);
    }

    function useItem(s, itemId, hsId) {
      const g = guard(s); if (g) return fail(g);
      if (!s.inv.includes(itemId)) return fail('你身上沒有那樣東西。');
      const h = hotspotById[hsId];
      if (!h || !isVisible(s, h)) return fail('這裡沒有那樣東西。');
      const out = result();
      const ctx = makeCtx(s, out);
      if (h.use && h.use[itemId]) h.use[itemId](ctx);
      else if (s.room === 'darkroom' && itemId === 'flashlight') ctx.say('你想起活板門上的警告——白光會毀掉一切。你沒有打開手電筒。');
      else if (h.useAny) h.useAny(ctx, itemId);
      else if (itemId === 'flashlight') ctx.say(`手電筒照亮了${h.name}，沒有發現什麼特別的。`);
      else ctx.say(`把${itemName(s, itemId)}用在${h.name}上，似乎沒什麼用。`);
      return done(s, out);
    }

    function findRecipe(a, b) {
      for (const r of G.recipes) {
        if (r.pair && ((r.pair[0] === a && r.pair[1] === b) || (r.pair[0] === b && r.pair[1] === a))) return r;
        if (r.match && r.match(a, b)) return r;
      }
      return null;
    }

    function combine(s, a, b) {
      const g = guard(s); if (g) return fail(g);
      if (a === b) return fail('同一樣東西沒辦法和自己組合。');
      if (!s.inv.includes(a) || !s.inv.includes(b)) return fail('你身上沒有那樣東西。');
      const r = findRecipe(a, b);
      if (!r) {
        const out = result();
        out.ok = false;
        out.messages.push({ text: `${itemName(s, a)}和${itemName(s, b)}組合不起來。`, kind: 'bad' });
        return out;
      }
      const out = result();
      r.run(makeCtx(s, out), a, b);
      return done(s, out);
    }

    function move(s, room) {
      const g = guard(s); if (g) return fail(g);
      if (!G.rooms[room]) return fail('沒有那個地方。');
      if (s.room === room) return fail('你已經在' + G.rooms[room].name + '了。');
      const out = result();
      enterRoom(s, room, out);
      return done(s, out);
    }

    function submit(s, puzzleId, answer) {
      const g = guard(s); if (g) return fail(g);
      const p = G.puzzles[puzzleId];
      if (!p) return fail('沒有那個機關。');
      if (!p.available(s)) return fail('現在沒辦法操作那個機關。');
      const out = result();
      const solved = p.check(makeCtx(s, out), answer);
      if (solved === null) return fail('這個選項現在不能用。'); // 不合法的輸入：不改變任何狀態
      out.solved = !!solved;

      if (!Array.isArray(s.inv) || s.inv.some(i => !G.items[i])) errs.push('物品無效');

    }

    return {
      G, newState, interact, useItem, combine, move, submit,
      hintList, revealHint, progress, visibleHotspots, canEnter, itemName, pageCount,
      validate, normalize, findRecipe,
      hotspot: id => hotspotById[id],
      clone: s => JSON.parse(JSON.stringify(s)),
    };
  }

  return { create };
}));

  const EYE_CENTERS = [[165, 80], [240, 200], [160, 320]]; // 真實天空由高到低三個星座的位置（各相隔約 48px）
  function eyepiece(dir) {
    const field = G.SKY_FIELDS[dir];
    const flip = ([x, y]) => [400 - x, 400 - y];
    const boxes = [];
    let stars = '';
    field.forEach((id, i) => {
      const c = G.CONSTELLATIONS[id];
      const [cx, cy] = EYE_CENTERS[i];
      boxes.push([cx - 44, cy - 44, cx + 44, cy + 44]);
      for (const [sx, sy] of c.stars) {
        const [px, py] = flip([cx - 36 + sx * 0.72, cy - 36 + sy * 0.72]);
        stars += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="7" fill="#fff6d8" opacity=".18"/><circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="3.4" fill="#fffaf0"/>`;
      }
    });
    // 背景暗星：避開星座範圍
    const r = rng(dir.split('').reduce((a, ch) => a * 31 + ch.charCodeAt(0), 7));
    let faint = '';
    for (let n = 0; n < 70; n++) {
      const x = 20 + r() * 360, y = 20 + r() * 360;
      const [fx, fy] = flip([x, y]);
      if (boxes.some(([a, b, c, d]) => x > a && x < c && y > b && y < d)) continue;
      faint += `<circle cx="${fx.toFixed(1)}" cy="${fy.toFixed(1)}" r="${(0.5 + r() * 0.6).toFixed(2)}" fill="#c8cfe6" opacity="${(0.25 + r() * 0.3).toFixed(2)}"/>`;
    }
    return `<svg viewBox="0 0 400 400" class="art eyepiece" role="img" aria-label="望遠鏡目鏡中的星空">
      <defs><clipPath id="eye-clip"><circle cx="200" cy="200" r="180"/></clipPath>
      <radialGradient id="eye-bg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#0d1430"/><stop offset="1" stop-color="#03050c"/></radialGradient></defs>
      <rect width="400" height="400" fill="#000"/>
      <g clip-path="url(#eye-clip)"><rect width="400" height="400" fill="url(#eye-bg)"/>${faint}${stars}
        <line x1="200" y1="20" x2="200" y2="380" stroke="#3a4a7a" stroke-width=".6" opacity=".5"/><line x1="20" y1="200" x2="380" y2="200" stroke="#3a4a7a" stroke-width=".6" opacity=".5"/></g>
      <circle cx="200" cy="200" r="182" fill="none" stroke="#a5783a" stroke-width="8"/><circle cx="200" cy="200" r="190" fill="none" stroke="#5a3d16" stroke-width="6"/>
    </svg>`;
  }

  // 方格紙 / 膠片 / 疊合
  function gridSvg({ digits = true, stars = false }) {
    const cs = 64, ox = 40, oy = 40;
    let out = '';
    const cross = (x, y) => `<path d="M${x - 9} ${y} h18 M${x} ${y - 9} v18" stroke="#b5473f" stroke-width="2"/>`;
    if (digits) {
      out += `<rect x="${ox - 20}" y="${oy - 20}" width="${cs * 5 + 40}" height="${cs * 5 + 40}" fill="#f2ecdc"/>`;
      for (let r = 0; r <= 5; r++) out += `<line x1="${ox}" y1="${oy + r * cs}" x2="${ox + cs * 5}" y2="${oy + r * cs}" stroke="#9fb0c8" stroke-width="1.2"/><line x1="${ox + r * cs}" y1="${oy}" x2="${ox + r * cs}" y2="${oy + cs * 5}" stroke="#9fb0c8" stroke-width="1.2"/>`;
      G.GRID_DIGITS.forEach((row, r) => row.forEach((d, c) => {
        out += `<text x="${ox + c * cs + cs / 2}" y="${oy + r * cs + cs / 2 + 9}" text-anchor="middle" font-size="27" fill="#2b2418" font-family="'JetBrains Mono',monospace">${d}</text>`;
      }));
    } else {
      out += `<rect x="${ox - 20}" y="${oy - 20}" width="${cs * 5 + 40}" height="${cs * 5 + 40}" fill="#cfe0f0" opacity=".25" stroke="#9fb0c8" stroke-dasharray="4 4"/>`;
    }
    if (stars) {
      for (const st of G.TRANSPARENCY_STARS) {
        const x = ox + st.c * cs + cs / 2, y = oy + st.r * cs + cs / 2;
        const sx = x - 19, sy = y - 19; // 星星畫在格子左上角，不遮住數字
        out += `<path d="M${sx} ${sy - 8} L${sx + 2.5} ${sy - 2.5} L${sx + 8} ${sy} L${sx + 2.5} ${sy + 2.5} L${sx} ${sy + 8} L${sx - 2.5} ${sy + 2.5} L${sx - 8} ${sy} L${sx - 2.5} ${sy - 2.5} Z" fill="#2d4f8a" opacity=".9"/>`;
        if (st.mark) {
          out += `<circle cx="${x}" cy="${y}" r="26" fill="none" stroke="#2d4f8a" stroke-width="2.5"/>
            <circle cx="${x + 22}" cy="${y - 22}" r="11" fill="#2d4f8a"/><text x="${x + 22}" y="${y - 17.5}" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">${st.mark}</text>`;
        }
      }
    }
    for (const [x, y] of [[ox - 8, oy - 8], [ox + cs * 5 + 8, oy - 8], [ox - 8, oy + cs * 5 + 8], [ox + cs * 5 + 8, oy + cs * 5 + 8]]) out += cross(x, y);
    const label = digits && stars ? '疊合的星圖' : digits ? '數字方格紙' : '星圖膠片';
    return `<svg viewBox="0 0 400 400" class="art" role="img" aria-label="${label}">${out}</svg>`;
  }

  // 撕開的便條：沿一道斜向的撕口分成左右兩半
  function note(which) {
    const lines = G.NOTE_LINES, n = lines.length;
    const lh = 34, top = 24, W = 440, H = top + n * lh + 16;
    const tearAt = i => 150 + i * 16;                                    // 第 i 行的撕口位置
    const by = k => top + k * lh;                                        // 第 k 條行界
    const tx = k => tearAt(k - 0.5) + (k % 2 ? 3 : -3);                  // 行界上的撕口（鋸齒）
    const tear = [];
    for (let k = 0; k <= n; k++) tear.push([tx(k), k === 0 ? 12 : k === n ? H - 8 : by(k)]);
    const leftPoly = [[16, 12], ...tear, [16, H - 8]].map(p => p.join(',')).join(' ');
    const rightPoly = [...tear, [W - 16, H - 8], [W - 16, 12]].map(p => p.join(',')).join(' ');
    const font = `font-size="21" fill="#2b2418" font-family="'LXGW WenKai TC','Kaiti TC','Noto Serif TC',serif"`;
    let out = '';
    if (which !== 'right') {
      out += `<polygon points="${leftPoly}" fill="#efe6cf"/>`;
      lines.forEach(([l], i) => { if (l) out += `<text x="${tearAt(i) - 8}" y="${by(i) + 26}" text-anchor="end" ${font}>${esc(l)}</text>`; });
    }
    if (which !== 'left') {
      out += `<g transform="translate(${which === 'full' ? 3 : 0} 0)"><polygon points="${rightPoly}" fill="#e9dfc4"/>`;
      lines.forEach(([, r], i) => { if (r) out += `<text x="${tearAt(i) + 8}" y="${by(i) + 26}" ${font}>${esc(r)}</text>`; });
      out += '</g>';
    }
    const maxTear = Math.max(...tear.map(p => p[0])), minTear = Math.min(...tear.map(p => p[0]));
    const vb = which === 'left' ? `0 0 ${maxTear + 16} ${H}` : which === 'right' ? `${minTear - 16} 0 ${W - minTear + 16} ${H}` : `0 0 ${W + 4} ${H}`;
    const label = { left: '便條左半：' + lines.map(l => l[0]).filter(Boolean).join('／'), right: '便條右半：' + lines.map(l => l[1]).filter(Boolean).join('／'), full: '拼好的便條' }[which];
    return `<svg viewBox="${vb}" class="art note-art note-${which}" role="img" aria-label="${esc(label)}">${out}</svg>`;
  }
